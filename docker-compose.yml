# Iktsuarpok 智能量化投资系统 —— Docker Compose 编排
#
# 三个服务：
#   mysql    : MySQL 8（首次启动自动执行 database_schema.sql 建表）
#   backend  : FastAPI 后端（容器内 3000 端口）
#   frontend : Nginx 托管前端静态包，并把 /api 反向代理给 backend
#
# 用法：
#   docker compose up -d --build      # 构建并启动
#   docker compose logs -f backend    # 看后端日志
#   docker compose down               # 停止并删除容器（不清空数据卷）
#
# 可调参数见下方 ${VAR:-默认值}，也可在项目根目录新建 .env 覆盖（.env 已 gitignore）。

name: iktsuarpok

services:
  mysql:
    image: mysql:8.0
    container_name: iktsuarpok-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: xb_quant
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 宿主机端口默认用 3307，避免与本机已有的 MySQL(3306) 冲突；只需外部工具连库时可删掉
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 仅在数据卷为空（首次启动）时执行，重复启动不会重跑
      - ./database_schema.sql:/docker-entrypoint-initdb.d/01-database_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: ./quant-invest-server-py
    container_name: iktsuarpok-backend
    restart: unless-stopped
    environment:
      # 数据库：容器内用服务名 mysql，不要写 127.0.0.1
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      DB_NAME: xb_quant
      # 账户凭证加密密钥：沿用本机 db_config.py 里的值，这样导入旧库后仍能解开已存凭证
      CRED_SECRET_KEY: ${CRED_SECRET_KEY:-tOoIfJO540WFebEK433DBp0bfMajwzJNqNokhYP3B1M=}
      # 登录 token 签名密钥
      XB_QUANT_SECRET: ${XB_QUANT_SECRET:-xb-quant-internal-secret}
      # 对话模型（默认指向宿主机上的 Ollama，而非容器内）
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen3:0.6b}
      # 向量化模型（RAG 知识库）
      EMBED_BASE_URL: ${EMBED_BASE_URL:-http://host.docker.internal:11434/v1}
      EMBED_API_KEY: ${EMBED_API_KEY:-ollama}
      EMBED_MODEL: ${EMBED_MODEL:-qwen3-embedding:0.6b}
    extra_hosts:
      # 让容器能访问宿主机的服务（Ollama、本机已有的 MySQL 等）；Docker Desktop 自带，Linux 需此声明
      - "host.docker.internal:host-gateway"
    volumes:
      # 向量知识库持久化（上传的文档、向量索引），重建容器不丢
      - kb-store:/app/kb_store
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.socket(); s.connect(('127.0.0.1', 3000)); s.close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    # 需要绕过 Nginx 直连后端调试时，取消下面注释
    # ports:
    #   - "3000:3000"

  frontend:
    build: ./quant-invest-vue
    container_name: iktsuarpok-frontend
    restart: unless-stopped
    ports:
      - "${WEB_HOST_PORT:-5189}:80"
    depends_on:
      - backend

volumes:
  mysql-data:   # MySQL 数据（含全部业务数据）
  kb-store:     # Chroma 向量知识库（kb_store/ 目录）
